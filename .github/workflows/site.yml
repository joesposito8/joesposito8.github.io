name: Site

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Page weight, canary and placeholders
        run: npm run check
      - name: Feeds
        run: npm run check:feeds
      - name: Links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --config lychee.toml --root-dir "${{ github.workspace }}/dist" --no-progress 'dist/**/*.html'
          fail: true
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits rather than cancelling a running deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
